services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meridian_rank
      # Local development only: the published port is restricted to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meridian_rank"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rank-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  rank-postgres:
