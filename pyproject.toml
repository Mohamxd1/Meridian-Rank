[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-rank"
version = "0.1.0"
description = "Tenant-scoped document ranking and network analysis with a shared sparse math core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "fastapi>=0.115",
  "uvicorn>=0.30", "redis>=5", "psycopg[binary]>=3.1", "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["networkx>=3.2", "pytest>=8", "matplotlib>=3.8", "httpx>=0.27", "ruff>=0.8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian_rank = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
